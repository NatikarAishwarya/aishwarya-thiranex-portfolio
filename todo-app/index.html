<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Aishwarya's JavaScript To-Do List application with task management and local storage.">

    <title>Aishwarya's To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-container">

        <!-- Header -->
        <header class="todo-header">
            <h1>My To-Do List</h1>

            <p>
                Organize your tasks and stay productive.
            </p>
        </header>


        <!-- Add Task Form -->
        <form class="task-input" id="todoForm">

            <label for="taskInput" class="sr-only">
                Enter a new task
            </label>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
                maxlength="150"
                autocomplete="off"
            >

            <button
                type="submit"
                id="addTaskBtn">
                Add Task
            </button>

        </form>


        <!-- Statistics -->
        <section
            class="stats"
            aria-label="Task statistics">

            <div class="stat-card">

                <strong id="totalCount">0</strong>

                <span>Total</span>

            </div>


            <div class="stat-card">

                <strong id="activeCount">0</strong>

                <span>Active</span>

            </div>


            <div class="stat-card">

                <strong id="completedCount">0</strong>

                <span>Completed</span>

            </div>

        </section>


        <!-- Filters -->
        <nav
            class="filters"
            aria-label="Task filters">

            <button
                type="button"
                class="filter active"
                data-filter="all">
                All
            </button>

            <button
                type="button"
                class="filter"
                data-filter="active">
                Active
            </button>

            <button
                type="button"
                class="filter"
                data-filter="completed">
                Completed
            </button>

        </nav>


        <!-- Tasks -->
        <section
            class="tasks-section"
            aria-label="Task list">

            <ul
                id="taskList"
                class="task-list">
            </ul>


            <!-- Empty State -->
            <div
                id="emptyMessage"
                class="empty-message">

                <div class="check-icon">
                    ✓
                </div>

                <h2>
                    No tasks yet.
                </h2>

                <p>
                    Add a task above to get started.
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
