{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Aishwarya Natikar — MCA student and aspiring web developer building accessible, responsive and user-friendly web applications.">
<meta name="theme-color" content="#0b1020"><title>{% block title %}Aishwarya Natikar | Web Developer{% endblock %}</title>
<link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="progress" id="scrollProgress" aria-hidden="true"></div>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="{% url 'home' %}" aria-label="Aishwarya Natikar home"><span class="brand-mark">AN</span><span>Aishwarya Natikar</span></a>
    <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="primaryNav" aria-label="Open navigation"><span></span><span></span><span></span></button>
    <nav id="primaryNav" class="nav" aria-label="Primary navigation">
      <a href="{% url 'home' %}">Home</a><a href="{% url 'about' %}">About</a><a href="{% url 'projects' %}">Projects</a><a href="{% url 'skills' %}">Skills</a><a class="nav-cta" href="{% url 'contact' %}">Let's talk <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
<main id="main-content">{% block content %}{% endblock %}</main>
<footer class="footer"><div class="container footer-inner"><p>© <span id="year"></span> Aishwarya Natikar. Built with semantic HTML, CSS, JavaScript & Django.</p><div><a href="{% url 'projects' %}">Projects</a><a href="{% url 'contact' %}">Contact</a></div></div></footer>
<script src="{% static 'portfolio/js/main.js' %}" defer></script>
